<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" role="img" aria-labelledby="t d"><title id="t">Counterpropagating optical beams and Doppler velocity classes in a vapor cell</title><desc id="d">Original schematic: a probe beam travels to the right, coupling beam travels left, atoms have a range of velocities within a rectangular vapour cell. Their signed wave vectors combine into the two photon Doppler shift, with unequal probe and coupling wavelengths producing residual broadening.</desc><rect width="1020" height="540" rx="24" fill="#0b2430"/><text x="45" y="60" font-family="Arial,sans-serif" font-size="24" fill="#b6f173">DOPPLER GEOMETRY / THERMAL VAPOUR</text><rect x="200" y="143" width="590" height="240" rx="13" fill="#12323f" stroke="#8aafb4" stroke-width="3"/><g stroke="#d3e7e3" opacity=".48" stroke-width="2"><path d="M215 143 V383 M775 143 V383"/></g><g stroke="#f59581" stroke-width="7" fill="none"><path d="M40 241 H930"/><path d="M930 241 l-22 -12 m22 12 -22 12"/></g><g stroke="#79d7f5" stroke-width="7" fill="none"><path d="M970 314 H82"/><path d="M82 314 l22 -12 m-22 12 22 12"/></g><g fill="#c4ffbf"><circle cx="310" cy="185" r="8"/><circle cx="427" cy="358" r="8"/><circle cx="534" cy="208" r="8"/><circle cx="663" cy="334" r="8"/></g><g stroke="#b6f173" stroke-width="4" fill="none"><path d="M310 185 l47 -28"/><path d="M427 358 l-38 -38"/><path d="M534 208 l64 39"/><path d="M663 334 l29 -37"/></g><g font-family="Arial,sans-serif" font-size="21" fill="#eafafa"><text x="45" y="221" fill="#ffb6a0">probe kₚ →</text><text x="818" y="350" fill="#8adcfb">← coupling k꜀</text><text x="339" y="178" fill="#d4efd0">atomic velocity v</text></g><rect x="90" y="416" width="850" height="92" rx="12" fill="#123940" stroke="#36646b"/><text x="113" y="452" font-family="Arial,sans-serif" font-size="21" fill="#e9f8f1">Δ₂-photon(v) = Δ₂-photon(0) − (kₚ + k꜀)·v</text><text x="113" y="483" font-family="Arial,sans-serif" font-size="17" fill="#b4d5d5">Use signed wavevectors; |kₚ| ≠ |k꜀| means imperfect cancellation.</text></svg>