<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Quantum state Bloch sphere, basis directions and relative phase</title><desc id="desc">Original scientific schematic of Bloch sphere for a two-state system. North plus z means state zero, south minus z state one, x and y directions are coherent superposition bases, and a state vector has azimuth phi and polar angle theta. Angles are conceptual.</desc><rect width="900" height="650" rx="22" fill="#0b2430"/><text x="48" y="59" font-family="Arial,sans-serif" font-size="23" fill="#b6f173">QUANTUM STATES / THE BLOCH SPHERE</text><g fill="none" stroke="#6b9ca3" stroke-width="3"><circle cx="450" cy="345" r="208"/><ellipse cx="450" cy="345" rx="208" ry="71" stroke-dasharray="6 7"/><path d="M450 104 V586"/><path d="M198 386 L704 300"/><path d="M303 507 L606 176"/></g><g stroke="#b6f173" stroke-width="6" stroke-linecap="round"><path d="M450 345 L556 171"/></g><path d="M450 260 C488 259 501 271 514 286" fill="none" stroke="#f7c785" stroke-width="4"/><path d="M480 350 Q516 345 521 319" fill="none" stroke="#f7c785" stroke-width="3"/><g font-family="Arial,sans-serif" font-size="24" fill="#e5f4f4"><text x="470" y="134">|0⟩ / +z</text><text x="464" y="606">|1⟩ / −z</text><text x="714" y="302">+x</text><text x="615" y="175">+y</text><text x="564" y="170" fill="#b6f173">|ψ⟩</text><text x="523" y="270" fill="#f7c785">θ</text><text x="521" y="367" fill="#f7c785">φ</text></g><text x="40" y="621" fill="#a9cbd0" font-family="Arial,sans-serif" font-size="18">State: cos(θ/2)|0⟩ + e^(iφ)sin(θ/2)|1⟩ · geometric model, not atom orbit</text></svg>