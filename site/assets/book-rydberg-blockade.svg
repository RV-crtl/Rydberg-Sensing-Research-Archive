<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="t d"><title id="t">Rydberg blockade with two laser-driven atoms and distance dependent interaction</title><desc id="d">Two atom locations separated by R, overlapping blockade regions of radius Rb, a strong interaction shift of the doubly-excited state. Shows interaction scaling C6/R to sixth power and the illustrative blockade criterion |V(Rb)| about ℏ Ω.</desc><rect width="1000" height="580" rx="25" fill="#0b2430"/><text x="45" y="60" font-family="Arial,sans-serif" font-size="25" fill="#b6f173">RYDBERG BLOCKADE / TWO-ATOM PICTURE</text><g opacity=".34" fill="#2f8a77"><circle cx="322" cy="295" r="183"/><circle cx="580" cy="295" r="183"/></g><g fill="#b6f173" stroke="#e1ffb3" stroke-width="3"><circle cx="322" cy="295" r="18"/><circle cx="580" cy="295" r="18"/></g><g stroke="#e4f5ef" stroke-width="3"><path d="M340 292 H562"/><path d="M345 286 L336 292 L345 299 M557 286 L566 292 L557 299"/></g><g fill="#e1ffff" font-family="Arial,sans-serif" font-size="24"><text x="400" y="267">distance R</text><text x="290" y="328">atom 1</text><text x="556" y="328">atom 2</text><text x="185" y="150">R<tspan baseline-shift="sub" font-size="16">b</tspan></text><text x="620" y="151">R<tspan baseline-shift="sub" font-size="16">b</tspan></text></g><path d="M255 340 Q233 400 206 411 M646 337 Q678 398 707 410" stroke="#79d4ec" stroke-width="4" fill="none"/><rect x="72" y="428" width="856" height="110" rx="14" fill="#123b40" stroke="#477573"/><g font-family="Arial,sans-serif" fill="#e3f5f3" font-size="21"><text x="96" y="461">Interaction energy: V(R) ≈ C₆ / R⁶ (van der Waals regime)</text><text x="96" y="495">Blockade scale: |V(R<tspan baseline-shift="sub" font-size="14">b</tspan>)| ≈ ℏΩ</text><text x="96" y="523" font-size="17" fill="#afd3d3">A soft criterion, not a hard geometrical boundary. Other interaction regimes exist.</text></g></svg>