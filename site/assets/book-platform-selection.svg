<g font-family="Arial,Helvetica,sans-serif">
<g font-size="24" font-weight="700" fill="#e7f6ee"><text x="74" y="414">Thermal vapour cell</text><text x="477" y="414">Cold atom cloud</text><text x="880" y="414">Optical tweezers</text><text x="1283" y="414">Cavity / ionisation</text></g>
<g font-size="17" fill="#c1dadc"><text x="74" y="456">Continuous probe / EIT</text><text x="74" y="485">Density + Doppler averaging</text><text x="74" y="514">Optical depth + detection</text><text x="74" y="560" fill="#b6f173">Gate: RF-off / coupling-off</text><text x="74" y="589" fill="#b6f173">Calibrated optical response</text>
<text x="477" y="456">MOT, molasses, state prep</text><text x="477" y="485">Trap lifetime + B-field</text><text x="477" y="514">Time-gated spectroscopy</text><text x="477" y="560" fill="#b6f173">Gate: density / temperature</text><text x="477" y="589" fill="#b6f173">Coherent optical reference</text>
<text x="880" y="456">Individual sites + blockade</text><text x="880" y="485">Loss, leakage and SPAM</text><text x="880" y="514">State-resolved readout</text><text x="880" y="560" fill="#b6f173">Gate: pair-distance sweep</text><text x="880" y="589" fill="#b6f173">Fidelity + held-out tests</text>
<text x="1283" y="456">Mode coupling / field ionisation</text><text x="1283" y="485">Resonator or extraction fields</text><text x="1283" y="514">State-to-detector transfer</text><text x="1283" y="560" fill="#b6f173">Gate: response / timing</text><text x="1283" y="589" fill="#b6f173">Calibrated loss / counts</text>
</g></g>
