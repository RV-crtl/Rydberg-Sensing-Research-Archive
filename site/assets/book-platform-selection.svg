<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 840" role="img" aria-labelledby="ttl desc">
<title id="ttl">Selecting a Rydberg research platform by measured observable and physical constraints</title>
<desc id="desc">Original decision map. The researcher first defines an observable, then selects thermal vapour spectroscopy, cold atom clouds, optical tweezer arrays, or cavity and ionisation platforms. Each path identifies quantitative calibration and validation gates, and every path feeds an evidence and uncertainty record. Conceptual, not a photograph or a published numerical result.</desc>
<defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2432"/><stop offset="1" stop-color="#06131f"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b6f173"/><stop offset="1" stop-color="#8de3bd"/></linearGradient><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#b6f173" stroke-width="2"/></marker></defs>
<rect width="1680" height="840" rx="30" fill="url(#background)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="65" y="74" font-size="32" font-weight="700" fill="#b6f173">CHOOSE THE OBSERVABLE BEFORE THE APPARATUS</text><text x="65" y="109" font-size="19" fill="#b1cbd0">A general Rydberg platform design map · no particular lab or quantum-state manifold assumed</text></g>
<rect x="495" y="151" width="690" height="120" rx="22" fill="#174451" stroke="url(#top)" stroke-width="3"/>
<text x="840" y="193" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#eaffed">Scientific question + required observable</text>
<text x="840" y="231" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle" fill="#c1dadc">Field? Spectrum? Gate fidelity? Correlations? Ion counts?</text>
<g fill="none" stroke="#b6f173" stroke-width="3" marker-end="url(#arrow)"><path d="M840 271V330H235V365"/><path d="M840 271V330H639V365"/><path d="M840 271V330H1041V365"/><path d="M840 271V330H1445V365"/></g>
<g stroke-width="2" stroke="#4d7881">
<rect x="49" y="367" width="374" height="273" rx="20" fill="#102f3b"/>
<rect x="452" y="367" width="374" height="273" rx="20" fill="#102f3b"/>
