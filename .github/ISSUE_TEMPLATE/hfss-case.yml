name: HFSS scientific case
description: Track a geometry, switch-state or numerical verification campaign.
title: "[HFSS] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: Scientific objective
      description: State hypothesis, design family, predicted coupling and pass/fail gates.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Exact simulation setup
      description: Geometry hash, materials, unit cell/finite size, AEDT version, boundary, excitation, mesh, frequency and ROI.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Native HFSS project, field returns and provenance
      description: Link original AEDT, mesh logs, complex fields and calculated matrix.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Rank, gain, condition, mesh and finite-transfer checks
    validations:
      required: true
