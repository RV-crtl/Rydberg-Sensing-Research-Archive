name: Research archive checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate exact asset hashes and source links
        run: python scripts/verify_archive.py
      - name: Verify recovered historical original sources
        run: python scripts/verify_history_sources.py
      - name: Verify canonical textbook exports match original chapter files
        run: python scripts/rebuild_academy.py --check
      - name: Classify official Australian collaboration deadlines without claiming open status
        run: python automation/opportunity_triage.py
      - name: Score textbook editorial depth without overstating maturity
        run: python automation/editorial_audit.py
      - name: Check current Rydberg research, source and book consistency
        run: python scripts/research_assistant.py
      - name: Test Stokes mathematics and archive coherence
        run: python -m unittest discover -s tests -v
      - name: Rebuild current research source index
        run: python scripts/rebuild_research_atlas.py
      - name: Verify standalone site and scientific data
        run: python scripts/verify_site.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: JavaScript syntax and model tests
        run: |
          node --check site/model.mjs
          node --input-type=module --check < site/explorer.js
          node --test tests/test_site_model.mjs tests/test_academy.mjs
          node --check site/academy.js
          node --check site/lab.js
          node --check site/diagnostics.js
          node --check site/workbook.mjs
          node --check book/workbook.mjs
      - name: Evidence summary
        run: python scripts/summarise_evidence.py
